
# Production profile — activate with: --spring.profiles.active=prod

# All routes will be prefixed /api/* — Nginx proxies /api/ → 127.0.0.1:8080
server.servlet.context-path=/api

# Never auto-migrate in production
spring.jpa.hibernate.ddl-auto=validate

# CAS SSO (Western University via WTS) - vrmm.eng.uwo.ca is registered as a trusted
# service domain in WTS's PRD CAS environment, covering any path under it.
cas.server.login-url=https://ssocas.uwo.ca/cas/login
cas.server.url-prefix=https://ssocas.uwo.ca/cas
cas.service.url=${APP_BASE_URL}/api/auth/cas/callback
