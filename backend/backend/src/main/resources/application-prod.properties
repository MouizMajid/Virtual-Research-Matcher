
# Production profile — activate with: --spring.profiles.active=prod

# All routes will be prefixed /api/* — Nginx proxies /api/ → 127.0.0.1:8080
server.servlet.context-path=/api

# Never auto-migrate in production
spring.jpa.hibernate.ddl-auto=validate

# CAS SSO (Western University via WTS). Unlike OIDC, CAS doesn't require an exact
# pre-registered redirect URI - WTS registered vrmm.eng.uwo.ca as a trusted service
# DOMAIN, covering any path under it, so cas.service.url below can be whatever path
# fits our app (see CasAuthenticationController's class comment for the full flow).
cas.server.login-url=https://ssocas.uwo.ca/cas/login
# url-prefix, not the full validate URL: Cas30ServiceTicketValidator appends
# /p3/serviceValidate itself (protocol 3 - the version that supports attributes).
cas.server.url-prefix=https://ssocas.uwo.ca/cas
cas.service.url=${APP_BASE_URL}/api/auth/cas/callback
