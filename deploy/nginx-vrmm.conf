# Redirect HTTP -> HTTPS
server {
    listen 80;
    server_name vrmm.eng.uwo.ca;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name vrmm.eng.uwo.ca;

    # TODO: set actual paths provided by Engineering IT
    ssl_certificate     /etc/ssl/eng.uwo.ca/fullchain.pem;
    ssl_certificate_key /etc/ssl/eng.uwo.ca/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # TODO: update to wherever `npm run build` output lives on the VM
    root /var/www/vrmm;
    index index.html;

    # React Router fallback
    location / {
        try_files $uri $uri/ /index.html;
    }


    # Spring Boot API — context-path=/api so path is preserved as-is
    # /api/postings -> 127.0.0.1:8080/api/postings -> Spring Boot routes /postings
    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
